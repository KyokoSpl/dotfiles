[global]
    width = 400
    offset = 5x50
    follow = mouse
    
    progress_bar_min_width = 380
    progress_bar_max_width = 380
    progress_bar_corner_radius = 2

    padding = 10
    horizontal_padding = 10
    frame_width = 1
    gap_size = 3
    font = "Monospace 14"

    icon_theme = "rose-pine-icons"
    enable_recursive_icon_lookup = true
    corner_radius = 2

    background = "#1e1e2e"
    foreground = "#cdd6f4"

[urgency_low]
    background = "#1e1e2e"
    highlight = "#94e2d5"
    frame_color = "#94e2d5"
    default_icon = "dialog-information"
    format = "<b><span foreground='#94e2d5'>%s</span></b>\n%b"

[urgency_normal]
    background = "#1e1e2e"
    highlight = "#f9e2af"
    frame_color = "#f9e2af"
    default_icon = "dialog-warning"
    format = "<b><span foreground='#f9e2af'>%s</span></b>\n%b"

[urgency_critical]
    background = "#11111b"
    highlight = "#f38ba8"
    frame_color = "#f38ba8"
    default_icon = "dialog-error"
    format = "<b><span foreground='#f38ba8'>%s</span></b>\n%b"

