##==> GLOBAL VARIABLES

##############################################################################################
$mainMod = Super 
$subMod = $mainMod+Shift
$term = alacritty
$multiplexer = tmux
$editor = alacritty -e nvim
$file = nemo
$browser = zen-browser
$binPath = ~/bin
##############################################################################################

##==> SYSTEM BINDS
##############################################################################################
bind = $mainMod, Return, exec, $term		 	  											 #==> Terminal
bind = $mainMod+Shift, Return, exec, $term -e $multiplexer  #==> Terminal with tmux
bind = $mainMod, D, exec, rofi -show drun  #==> Application launcher
bind = $mainMod+Shift, D, exec, rofi -show run  #==> Command runner
bind = $mainMod+Alt, D, exec, wmenu-run
bind = Super+Alt, L, exec, hyprlock  #==> Lock screen
bind = $mainMod, E, exec, alacritty -e nvim
bind = $mainMod+Shift, E, exec, thunar
bind = $mainMod, B, exec, zen-browser
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy  #==> Clipboard manager
bind = Alt, Tab, exec, rofi -show window#==> Window switcher forward
bind = Alt+Shift, Tab, exec, hyprswitch gui --mod-key alt --key tab --close mod-key-release --reverse-key=key=grave && hyprswitch dispatch -r  #==> Window switcher backward
bind = $mainMod, N, exec, swaync-client -t  #==> Notification center
bind = $mainMod, P, exec, $term -e nvim ~/Notes/notepad.md  #==> Notepad
bind = $mainMod, X, exec, wlogout  #==> Power menu
bind = $mainMod+Shift, C, exec, pavucontrol  #==> Audio control center
bind = $mainMod+Shift, N, exec, hyprshade toggle blue-light-filter  #==> Night mode
bind = $mainMod+Shift, V, exec, clapboard
bind = $mainMod+Shift, S, exec, grim -g "$(slurp)" - | wl-copy  #==> Selection screenshot to clipboard
##############################################################################################

##==> SYSTEM CONTROLS
#################################################################################################
#-----------------------------------------------------------------------------------------------## VOLUME	
bindel = , XF86AudioRaiseVolume, exec, sh $HOME/bin/volume.sh --device output --action increase #==> increase volume 
bindel = , XF86AudioLowerVolume, exec, sh $HOME/bin/volume.sh --device output --action decrease #==> decrease volume 
bindl  = , XF86AudioMute, exec, sh $HOME/bin/volume.sh --device output --action toggle 			#==> toggle audio mute
bindl  = , XF86AudioMicMute, exec, sh $HOME/bin/volume.sh --device input --action toggle        #==> toggle micro muteSS
#-----------------------------------------------------------------------------------------------## PLAYER
bindl  = , XF86AudioPlay, exec, playerctl play-pause							 				#==> toggle between media play and pause
bindl  = , XF86AudioPause, exec, playerctl play-pause							 			    #==> toggle between media play and pause
bindl  = , XF86AudioNext, exec, playerctl next 									 			 	#==> media next
bindl  = , XF86AudioPrev, exec, playerctl previous 								 			 	#==> media previous
bindl  = , XF86AudioStop, exec, playerctl stop 									 			 	#==> media stop
#-----------------------------------------------------------------------------------------------## BRIGHTNESS								  
bindel = , XF86MonBrightnessUp, exec, sh $HOME/bin/brightness.sh --up 		  			 	#==> increase brightness
bindel = , XF86MonBrightnessDown, exec, sh $HOME/bin/brightness.sh --down 		  	 	 	#==> decrease brightness
#################################################################################################


##==> HYPRLAND
##############################################################################################
#--------------------------------------------------------------------------------------------# Session actions

bind = $mainMod, Y, exec, hyprctl keyword input:kb_layout us
bind = $mainMod, Z, exec, hyprctl keyword input:kb_layout de
bind = $mainMod, Delete, exit						 										 #==> Kill hyprland session
bind = Ctrl+Shift, R, exec, hyprctl reload						 						     #==> Reload hyprland session
#--------------------------------------------------------------------------------------------# Window actions
bind = $mainMod, C, exec, hyprctl dispatch killactive ""   									 #==> close focused window
bind = $mainMod, F, togglefloating				  										 #==> toggle the window between focus and float
bind = $mainMod+Shift, F, fullscreen  					 										 #==> toggle the window between focus and fullscreen
#--------------------------------------------------------------------------------------------## Move/Change window focus
bind = $mainMod, Right, movefocus, r  #==> Move right
bind = $mainMod, Left, movefocus, l  #==> Move left
bind = $mainMod, Up, movefocus, u  #==> Move up
bind = $mainMod, Down, movefocus, d  #==> Move Down
bind = Alt, Tab, movefocus, d  #==> Alt+Tab 
# hjkl movement for focus
bind = $mainMod, H, movefocus, l  #==> Move left (hjkl)
bind = $mainMod, J, movefocus, d  #==> Move down (hjkl)
bind = $mainMod, K, movefocus, u  #==> Move up (hjkl)
bind = $mainMod, L, movefocus, r  #==> Move right (hjkl)
#--------------------------------------------------------------------------------------------## Switch workspaces
bind = $mainMod, 1, split-workspace, 1  #==> Switch to 1 workspace
bind = $mainMod, 2, split-workspace, 2  #==> Switch to 2 workspace
bind = $mainMod, 3, split-workspace, 3  #==> Switch to 3 workspace
bind = $mainMod, 4, split-workspace, 4  #==> Switch to 4 workspace
bind = $mainMod, 5, split-workspace, 5  #==> Switch to 5 workspace
bind = $mainMod, 6, split-workspace, 6  #==> Switch to 6 workspace
bind = $mainMod, 7, split-workspace, 7  #==> Switch to 7 workspace
bind = $mainMod, 8, split-workspace, 8  #==> Switch to 8 workspace
bind = $mainMod, 9, split-workspace, 9  #==> Switch to 9 workspace
bind = $mainMod, 0, split-workspace, 10  #==> Switch to 10 workspace
bind = $mainMod+Ctrl, Right, split-workspace, r+1  #==> Switch to next workspace
bind = $mainMod+Ctrl, Left, split-workspace, r-1  #==> Switch to prev workspace
bind = $mainMod+Ctrl, Down, split-workspace, empty  #==> Switch to the first empty workspace
bind = $mainMod, mouse_down, split-workspace, e+10  #==> Scroll workspaces forward
bind = $mainMod, mouse_up, split-workspace, e-10  #==> Scroll workspaces back						
#--------------------------------------------------------------------------------------------## Resize windows
binde = $mainMod+Shift, Right, resizeactive, 30 0											 #==> Resize to the right
binde = $mainMod+Shift, Left, resizeactive, -30 0											 #==> Resize to the left
binde = $mainMod+Shift, Up, resizeactive, 0 -30												 #==> Resize to the up
binde = $mainMod+Shift, Down, resizeactive, 0 30											 #==> Resize to the down
bindm = $mainMod, mouse:273, resizewindow													 #==> Resize with the mouse
#--------------------------------------------------------------------------------------------## Move focused window to a workspace
bind = $mainMod+Shift, 1, split-movetoworkspacesilent, 1  #==> Move to 1 workspace
bind = $mainMod+Shift, 2, split-movetoworkspacesilent, 2  #==> Move to 2 workspace
bind = $mainMod+Shift, 3, split-movetoworkspacesilent, 3  #==> Move to 3 workspace
bind = $mainMod+Shift, 4, split-movetoworkspacesilent, 4  #==> Move to 4 workspace
bind = $mainMod+Shift, 5, split-movetoworkspacesilent, 5  #==> Move to 5 workspace
bind = $mainMod+Shift, 6, split-movetoworkspacesilent, 6  #==> Move to 6 workspace
bind = $mainMod+Shift, 7, split-movetoworkspacesilent, 7  #==> Move to 7 workspace
bind = $mainMod+Shift, 8, split-movetoworkspacesilent, 8  #==> Move to 8 workspace
bind = $mainMod+Shift, 9, split-movetoworkspacesilent, 9  #==> Move to 9 workspace
bind = $mainMod+Shift, 0, split-movetoworkspacesilent, 10  #==> Move to 10 workspace
#--------------------------------------------------------------------------------------------## Move focused window around the current workspace
bind = $mainMod+Shift+Ctrl, Right, movewindow, r  #==> Move to right
bind = $mainMod+Shift+Ctrl, Left, movewindow, l  #==> Move to left
bind = $mainMod+Shift+Ctrl, Up, movewindow, u  #==> Move to up
bind = $mainMod+Shift+Ctrl, Down, movewindow, d  #==> Move to down
bindm = $mainMod, mouse:272, movewindow     #==> Move with the mouse
# hjkl movement for windows
bind = $mainMod+Shift, H, movewindow, l  #==> Move left (hjkl)
bind = $mainMod+Shift, J, movewindow, d  #==> Move down (hjkl)
bind = $mainMod+Shift, K, movewindow, u  #==> Move up (hjkl)
bind = $mainMod+Shift, L, movewindow, r  #==> Move right (hjkl)
#--------------------------------------------------------------------------------------------## Silent workspaces
bind = $mainMod+Alt, S, movetoworkspacesilent, special										 #==> Move window to silent workspace
bind = $mainMod+Alt, S, movetoworkspace, previous											 #==> Move window to a regular workspace
bind = $mainMod, S, togglespecialworkspace													 #==> Open a silent workspace
##############################################################################################
