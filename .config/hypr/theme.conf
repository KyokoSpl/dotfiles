exec = hyprctl setcursor Emo 26
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Emo'
exec = gsettings set org.gnome.desktop.interface cursor-size 26


# █ █▀▀ █▀█ █▄░█   ▀█▀ █░█ █▀▀ █▀▄▀█ █▀▀
# █ █▄▄ █▄█ █░▀█   ░█░ █▀█ ██▄ █░▀░█ ██▄
exec = gsettings set org.gnome.desktop.interface icon-theme 'Tela-circle-dracula'


# █▀ █▀█ █▀▀ █▀▀ █ ▄▀█ █░░
# ▄█ █▀▀ ██▄ █▄▄ █ █▀█ █▄▄

decoration {
    dim_special = 0.3
    blur {
        special = true
    }
    active_opacity = 1
    inactive_opacity = 1
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 3
        # One Dark active border gradient
        col.active_border = rgb(61afef) rgb(56b6c2) 45deg
        # One Dark inactive border gradient
        col.inactive_border = rgb(3e4451) rgb(4b5263) 45deg
    layout = dwindle
    resize_on_border = true

}

decoration {
    rounding = 10

    blur {
        enabled = yes
        size = 6
        passes = 3
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

