# More option see https://github.com/DreamMaoMao/mango/wiki/

# Autostart
exec-once = quickshell
exec-once = awww-daemon
exec-once = nm-applet
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = ~/.local/bin/setwallpaper.sh
exec-once = ~/.local/bin/nightlight.sh
exec-once = swayidle -w \
  timeout 300 'hyprlock & sleep 300 && systemctl suspend' \
  before-sleep 'pidof hyprlock || hyprlock'

# Monitor Configuration
monitorrule=name:^DP-2$,width:1920,height:1080,refresh:239.96,x:1680,y:0,scale:1
monitorrule=name:^DP-1$,width:1680,height:1050,refresh:75.03,x:0,y:0,scale:1

# Window effect
blur=1
blur_layer=1
blur_optimized=1
#blur_params_num_passes = 2
blur_params_num_passes = 4
#blur_params_radius = 5
blur_params_radius = 8
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 0
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 10
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=6
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.3
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=400
animation_duration_tag=350
animation_duration_close=800
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_mfact=0.55
default_nmaster=1
smartgaps=0

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1

# keyboard
repeat_rate=25
repeat_delay=600
numlockon=1
xkb_rules_layout=us,de
xkb_rules_options=grp:alt_shift_toggle,caps:escape

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0
accel_profile = 1
accel_speed = -0.25

# Cursor Theme
cursor_size=22
#cursor_theme = Pop
#cursor_theme = Vimix-cursors
cursor_theme = Bibata-Modern-Classic

# Appearance
gappih=5
gappiv=5
gappoh=10
gappov=10
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=4
rootcolor=0x201b14ff
# bordercolor=0x444444ff
bordercolor=0x37474fff
# focuscolor=0xc9b890ff
focuscolor=0x80cbc4ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

##==> SYSTEM BINDS
# reload config
bind=CTRL+SHIFT,r,reload_config

# terminal
bind=SUPER,Return,spawn,ghostty
bind=SUPER+SHIFT,Return,spawn,alacritty -e tmux

# launcher
bind=SUPER,d,spawn,rofi -show drun
bind=SUPER+SHIFT,d,spawn,rofi -show run
bind=SUPER+ALT,d,spawn,wmenu-run

# apps
bind=SUPER,e,spawn,alacritty -e nvim
bind=SUPER+SHIFT,e,spawn,thunar
bind=SUPER,b,spawn,zen-browser
bind=SUPER,p,spawn,alacritty -e nvim ~/Notes/notepad.md
bind=SUPER,slash,spawn,mango-cheatsheet

# clipboard
bind=SUPER,v,spawn,cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind=SUPER+SHIFT,v,spawn,clapboard

# utilities
bind=SUPER,n,spawn,swaync-client -t
bind=SUPER+SHIFT,n,spawn,hyprshade toggle blue-light-filter
bind=SUPER+SHIFT,c,spawn,pavucontrol
bind=SUPER,x,spawn,wlogout

# screenshots
bind=SUPER+SHIFT,s,spawn,~/.config/mango/screenshot.sh

# screen lock
bind=SUPER+ALT,l,spawn,hyprlock

##==> SESSION / EXIT
bind=SUPER,Delete,quit
bind=SUPER,c,killclient,

##==> WINDOW FOCUS
bind=SUPER,Tab,focusstack,next
# hjkl
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
# arrow keys
bind=SUPER,Right,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

##==> MOVE / SWAP WINDOWS
# hjkl
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right
# arrow keys
bind=SUPER+SHIFT+CTRL,Right,exchange_client,right
bind=SUPER+SHIFT+CTRL,Left,exchange_client,left
bind=SUPER+SHIFT+CTRL,Up,exchange_client,up
bind=SUPER+SHIFT+CTRL,Down,exchange_client,down

##==> RESIZE WINDOWS
bind=SUPER+SHIFT,Right,resizewin,+30,+0
bind=SUPER+SHIFT,Left,resizewin,-30,+0
bind=SUPER+SHIFT,Up,resizewin,+0,-30
bind=SUPER+SHIFT,Down,resizewin,+0,+30

##==> WINDOW STATUS
bind=SUPER,f,togglefloating,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,toggleoverview,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,i,restore_minimized

##==> SCRATCHPAD / SPECIAL WORKSPACE
bind=SUPER,s,toggle_scratchpad
bind=SUPER+ALT,s,toggle_scratchpad

##==> SCROLLER LAYOUT (mango specific)
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,

##==> SWITCH LAYOUT (mango specific)
bind=SUPER+ALT,n,switch_layout

##==> TAG / WORKSPACE SWITCH
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+CTRL,Right,viewtoright,0
bind=SUPER+CTRL,Left,viewtoleft,0

##==> MOVE WINDOW TO TAG (silent)
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

##==> MONITOR SWITCH
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

##==> GAPS
bind=ALT+SHIFT,x,incgaps,1
bind=ALT+SHIFT,z,incgaps,-1
bind=ALT+SHIFT,r,togglegaps

##==> MOUSE BINDINGS
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

##==> AXIS BINDINGS
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

##==> VOLUME
bind=NONE,XF86AudioRaiseVolume,spawn,sh ~/bin/volume.sh --device output --action increase
bind=NONE,XF86AudioLowerVolume,spawn,sh ~/bin/volume.sh --device output --action decrease
bind=NONE,XF86AudioMute,spawn,sh ~/bin/volume.sh --device output --action toggle
bind=NONE,XF86AudioMicMute,spawn,sh ~/bin/volume.sh --device input --action toggle

##==> PLAYER CONTROLS
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86AudioStop,spawn,playerctl stop

##==> BRIGHTNESS
bind=NONE,XF86MonBrightnessUp,spawn,sh ~/bin/brightness.sh --up
bind=NONE,XF86MonBrightnessDown,spawn,sh ~/bin/brightness.sh --down

##==> LAYER RULES
layerrule=animation_type_open:zoom,layer_name:rofi
layerrule=animation_type_close:zoom,layer_name:rofi
layerrule=noblur:1,layer_name:selection

##==> WINDOW RULES
windowrule=isfloating:1,width:600,height:400,title:nmtui
windowrule=isfloating:1,width:1600,height:1400,title:Cider
windowrule=isfloating:1,width:500,height:700,offsety:-85,appid:nm-connection-editor
