# Window rules migrated from config.kdl (Niri format)
# Comments and structure preserved as much as possible

window-rule {
    min-height 400
    min-width 420
}
window-rule {
    geometry-corner-radius 12
    clip-to-geometry true
}
window-rule {
    match app-id=r"^org\.wezfurlong\.wezterm$"
    default-column-width {}
}
window-rule {
}
window-rule {
    match app-id="org.gnome.Characters"
    default-column-width { proportion 0.4; }
}
window-rule {
    match app-id="firefox"
    default-column-width { fixed 1425; }
    draw-border-with-background true    
}
window-rule {
    match app-id="discord"
    open-maximized true
}
window-rule {
    match app-id="zen"
    open-maximized true
}
window-rule {
    match app-id="emacs"
    open-maximized true
}
window-rule {
    match app-id="Emacs"
    open-maximized true
}
window-rule {
    match title="Emacs"
    open-maximized true
}
window-rule {
    match app-id="code"
    default-column-width { fixed 920; }
    open-maximized true
}
window-rule {
    match app-id="Code"
    open-maximized true
}
window-rule {
    match app-id="vlc"
    default-column-width { fixed 920; }
    open-maximized true
}
window-rule {
    match app-id="org.gnome.Nautilus"
    default-column-width { proportion 0.75; }
}
window-rule {
    match title="Friends List" app-id="steam"
    default-column-width { fixed 340; }
}
window-rule {
    match app-id="Waydroid"
    default-column-width { fixed 1256; }
}
window-rule {
    match title="niri-cheatsheet"
    default-column-width { fixed 400; }
    min-width 350
    max-width 450
    min-height 500
    max-height 800
}
window-rule {
    match app-id="niri-cheatsheet"
    default-column-width { fixed 400; }
    min-width 350
    max-width 450
    min-height 500
    max-height 800
}
