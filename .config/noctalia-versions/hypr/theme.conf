# █▀▀ █░█ █▀█ █▀ █▀█ █▀█
# █▄▄ █▄█ █▀▄ ▄█ █▄█ █▀▄

exec = hyprctl setcursor Catppuccin-Mocha-Sky 20
exec = gsettings set org.gnome.desktop.interface cursor-theme 'Catppuccin-Mocha-Sky'
exec = gsettings set org.gnome.desktop.interface cursor-size 20


# █ █▀▀ █▀█ █▄░█   ▀█▀ █░█ █▀▀ █▀▄▀█ █▀▀
# █ █▄▄ █▄█ █░▀█   ░█░ █▀█ ██▄ █░▀░█ ██▄
exec = gsettings set org.gnome.desktop.interface icon-theme 'Tela-circle-dracula'


# █▀ █▀█ █▀▀ █▀▀ █ ▄▀█ █░░
# ▄█ █▀▀ ██▄ █▄▄ █ █▀█ █▄▄

decoration {
    dim_special = 0.3
    blur {
        special = true
    }
    active_opacity = 1
    inactive_opacity = 1
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 3
        # One Dark active border gradient
        col.active_border = rgb(61afef) rgb(56b6c2) 45deg
        # One Dark inactive border gradient
        col.inactive_border = rgb(3e4451) rgb(4b5263) 45deg
    layout = dwindle
    resize_on_border = true

}

decoration {
    rounding = 20
    rounding_power = 2

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = yes
        size = 3
        passes = 2
        vibrancy = 0.1696
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

layerrule = blur,waybar
